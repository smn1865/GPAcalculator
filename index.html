        <div class="grade-menu">

          <label>
            Login
            <input type="text" id="login-username" required />

          <label>

            <input type="password" id="login-password" required />
          </label>
          <button type="submit" class="login-submit">Enter</button>
          <div id="login-error" class="login-error"></div>
        </form>
